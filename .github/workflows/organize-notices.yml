name: Daily notice archive

on:
  schedule:
    # GitHub cron 使用 UTC：16:10 UTC = 次日北京时间 00:10。
    - cron: '10 16 * * *'

permissions:
  contents: write

concurrency:
  group: daily-notice-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '12.18.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test organizer
        run: pnpm notices:test

      - name: Organize notices
        run: pnpm notices:organize --apply

      - name: Verify production site
        run: pnpm docs:build && pnpm docs:check

      - name: Commit notice directory changes
        shell: bash
        run: |
          git add -- docs/notices
          if git diff --cached --quiet; then
            echo 'No notice moves today.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: archive notices by publication date'
          # 如果 CMS 在运行期间产生新提交，普通 push 会拒绝，不覆盖它的更新。
          git push origin HEAD:main
